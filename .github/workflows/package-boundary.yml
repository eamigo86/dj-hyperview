name: Package boundary

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  wheel-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run pytest tests/test_package_boundary.py -q
      - run: uv build
      - run: uv run python -m tools.package_guard dist/*.whl
