name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      redis:
        description: Run live Redis acceptance
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      redis:
        description: Run live Redis acceptance
        type: boolean
        default: true

permissions:
  contents: read

# A distinct prefix: a called workflow sees the caller's name in github.workflow,
# and the same group in both would deadlock the release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.22"
      - name: Sync exact development environment
        run: uv sync --locked
      - name: Test browser JavaScript
        run: node --test tests/js/*.mjs
      - name: Check dependency and style drift
        run: |
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
      - name: Check Django profiles and migrations
        run: |
          PYTHONPATH=.:src uv run python -m django check --settings=tests.settings
          PYTHONPATH=.:src uv run python -m django check --settings=tests.settings_database
          PYTHONPATH=.:src uv run python -m django check --settings=tests.settings_database_admin
          PYTHONPATH=.:src uv run python -m django makemigrations dj_hyperview_database --check --dry-run --settings=tests.settings_database
      - name: Check public and package boundaries
        run: |
          uv run pytest -q tests/test_dependency_policy.py tests/test_package_boundary.py
          uv run pytest -q tests/test_public_api_quality.py

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2.17", "6.1.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.22"
      - name: Run aggregate branch coverage
        run: >-
          uv run --locked --python ${{ matrix.python }}
          --with Django==${{ matrix.django }}
          python -m tools.test_matrix
          --django-version ${{ matrix.django }}
      - name: Upload coverage to Codecov
        if: ${{ matrix.python == '3.12' && matrix.django == '6.1.1' && github.ref_type != 'tag' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.xml
          name: default
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  redis:
    if: ${{ toJSON(inputs.redis) != 'false' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJHV_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:8.2.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.22"
      - run: uv sync --locked --group redis
      - name: Run live Redis acceptance
        run: >-
          uv run --locked --group redis python -m tools.test_matrix --redis
          --django-version 6.1.1
      - name: Upload Redis coverage to Codecov
        if: ${{ github.ref_type != 'tag' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.xml
          name: redis
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  artifacts:
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.22"
      - run: uv sync --locked
      - name: Build and inspect distributions
        run: |
          uv build
          uv run python -m tools.package_guard dist/*.whl
      - name: Smoke installed wheel outside checkout
        run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir/venv" --python 3.12
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          (
            cd "$smoke_dir"
            unset PYTHONPATH
            "$smoke_dir/venv/bin/python" -I -c 'from pathlib import Path; import xmlschema; import dj_hyperview; from django.conf import settings; settings.configure(HYPERVIEW={}); assert Path(dj_hyperview.__file__).resolve().is_relative_to(Path.cwd() / "venv"); assert xmlschema.__version__; assert dj_hyperview.HYPERVIEW_VALIDATION_CONTRACT == "automatic-xsd-v1"; assert dj_hyperview.validate_hxml("<view xmlns=\"https://hyperview.org/hyperview\"/>")'
          )
      - name: Smoke optional wheel profiles
        run: |
          wheel="$(echo dist/*.whl)"
          schema_dir="$(mktemp -d)"
          uv venv "$schema_dir/venv" --python 3.12
          uv pip install --python "$schema_dir/venv/bin/python" "${wheel}[schema]"
          editor_dir="$(mktemp -d)"
          uv venv "$editor_dir/venv" --python 3.12
          uv pip install --python "$editor_dir/venv/bin/python" "${wheel}[editor]"
          (cd "$schema_dir" && unset PYTHONPATH && "$schema_dir/venv/bin/python" -I -c 'import xmlschema; from dj_hyperview import validate_hyperview_schema; assert xmlschema.__version__')
          (cd "$editor_dir" && unset PYTHONPATH && "$editor_dir/venv/bin/python" -I -c 'import django_ace; from dj_hyperview.contrib.database.admin_editor import HyperviewAceWidget; assert django_ace and HyperviewAceWidget')
      - name: Build strict documentation
        run: uv run zensical build --clean --strict -f zensical.yml
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/*
            site/
          if-no-files-found: error
          retention-days: 7
