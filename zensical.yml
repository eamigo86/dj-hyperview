site_name: dj-hyperview
site_description: Django infrastructure for serving consumer-owned Hyperview UI
site_author: Ernesto Perez Amigo
site_url: https://eamigo86.github.io/dj-hyperview/
repo_url: https://github.com/eamigo86/dj-hyperview
repo_name: eamigo86/dj-hyperview
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  variant: classic
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - javascripts/source-facts.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Mobile Getting Started: mobile-getting-started.md
      - Configuration: configuration.md
      - Hyperview compatibility: hyperview-0.110.0.md
  - User Guide:
      - Filesystem sources: filesystem.md
      - Database and admin: database-admin.md
      - Cache consistency: cache-consistency.md
      - Security: security.md
      - HTTP responses: http-responses.md
  - API Reference:
      - Public Python API: api-reference.md
  - Development:
      - Testing integrations: testing.md
      - Contributing: contributing.md
      - Release and rollback: release-rollback.md
      - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eamigo86/dj-hyperview
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dj-hyperview/

copyright: Copyright &copy; 2026 Ernesto Perez Amigo
