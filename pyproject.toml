[project]
name = "dj-hyperview"
version = "0.1.0a3"
description = "Django infrastructure for server-driven Hyperview interfaces"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=5.2,<6.2",
    "lxml>=6.1.3,<7",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.16,<8",
    "packaging>=26.3,<27",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-django>=4.14,<5",
    "ruff>=0.16.6,<0.17",
    "uv-build>=0.12.9,<0.13",
    "zensical==0.0.59",
]
redis = ["redis==8.1.0"]

[tool.uv]
package = false

[tool.dj-hyperview]
dependency-audit-date = "2026-09-04"
supported-python = ["3.12", "3.13", "3.14"]
supported-django = ["5.2.17", "6.1.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--strict-config --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dj_hyperview"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
